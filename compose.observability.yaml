services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command: --config.file=/etc/prometheus/prometheus.yml --web.enable-remote-write-receiver
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-local-only}
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  k6:
    image: grafana/k6:1.2.2
    profiles: [load-test]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BASE_URL: ${BASE_URL:-http://host.docker.internal:8080}
      TOKEN_ISSUER: ${TOKEN_ISSUER:-http://mock-idp:8080/ride}
      TOKEN_ISSUER_HOST: ${TOKEN_ISSUER_HOST:-localhost:8090}
      RUN_ID: ${RUN_ID:-}
      GENERATE_LOCAL_TOKENS: ${GENERATE_LOCAL_TOKENS:-true}
      RIDER_TOKENS: ${RIDER_TOKENS:-[]}
      DRIVER_TOKENS: ${DRIVER_TOKENS:-[]}
      FALLBACK_DRIVER_TOKENS: ${FALLBACK_DRIVER_TOKENS:-[]}
      VUS: ${VUS:-1}
      DURATION: ${DURATION:-1m}
      MIN_ITERATION_DURATION: ${MIN_ITERATION_DURATION:-1s}
      POLL_SECONDS: ${POLL_SECONDS:-5}
      MAX_POLLS: ${MAX_POLLS:-12}
      DECLINE_RATE: ${DECLINE_RATE:-0}
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 1s
      K6_PROMETHEUS_RW_LABELS: testid=${RUN_ID:-unset}
      K6_PROMETHEUS_RW_TREND_STATS: p(95),p(99),avg,max
    volumes:
      - ./loadtest:/scripts:ro
    command: run --out experimental-prometheus-rw /scripts/ride-offer-flow.js
