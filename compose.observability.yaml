services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    command: ["--docker_only=true"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

  prometheus:
    image: prom/prometheus:v3.5.0
    command: --config.file=/etc/prometheus/prometheus.yml --web.enable-remote-write-receiver
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - cadvisor

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-local-only}
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  k6:
    image: grafana/k6:1.2.2
    profiles: [load-test]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TOKEN_ISSUER: ${TOKEN_ISSUER:-http://mock-idp:8080/ride}
      TOKEN_ISSUER_HOST: ${TOKEN_ISSUER_HOST:-localhost:8090}
      TOKEN_ISSUER_CLIENT_AUTH: ${TOKEN_ISSUER_CLIENT_AUTH:-}
      RUN_ID: ${RUN_ID:-}
      CLOUD_RUN_TASK_INDEX: ${CLOUD_RUN_TASK_INDEX:-0}
      RIDER_TOKENS: ${RIDER_TOKENS:-[]}
      DRIVER_TOKENS: ${DRIVER_TOKENS:-[]}
      POLL_SECONDS: ${POLL_SECONDS:-5}
      RIDER_CANCEL_RATE: ${RIDER_CANCEL_RATE:-0}
      DRIVER_DECLINE_RATE: ${DRIVER_DECLINE_RATE:-0}
      TRIP_MIN_MINUTES: ${TRIP_MIN_MINUTES:-5}
      TRIP_MAX_MINUTES: ${TRIP_MAX_MINUTES:-30}
      TIME_SCALE: ${TIME_SCALE:-60}
      BENCHMARK_PROFILE: ${BENCHMARK_PROFILE:-full}
      COHORT_STAGES: ${COHORT_STAGES:-}
      IMPLEMENTATION: ${IMPLEMENTATION:-springboot}
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 2s
      K6_PROMETHEUS_RW_TREND_STATS: p(50),p(95),p(99),avg,max
    volumes:
      - ./loadtest:/scripts:ro
    command: run --tag testid=${RUN_ID:-unset} --tag implementation=${IMPLEMENTATION:-springboot} --out experimental-prometheus-rw /scripts/population-ramp.js
