spring.application.name=ride-matching-springboot
ride.gps.pickup-radius-metres=50
ride.offer-timeout=30s
ride.penalty-duration=30m

# Defaults target the workspace mock issuer; production overrides these variables.
app.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8090/ride/jwks}
app.jwt.issuer-uri=${JWT_ISSUER_URI:http://localhost:8090/ride}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}
