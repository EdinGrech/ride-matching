quarkus.application.name=ride-matching-quarkus
ride.gps.pickup-radius-metres=50
ride.offer-timeout=30s
ride.penalty-duration=30m

mp.jwt.verify.publickey.location=${JWT_JWK_SET_URI:http://localhost:8090/ride/jwks}
mp.jwt.verify.issuer=${JWT_ISSUER_URI:http://localhost:8090/ride}
smallrye.jwt.path.groups=roles

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}
quarkus.http.cors.methods=GET,POST,PUT,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated
