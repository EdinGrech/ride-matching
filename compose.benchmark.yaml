services:
  api:
    build:
      context: ${API_CONTEXT:-./ride-matching-springboot}
      dockerfile: ${API_DOCKERFILE:-Dockerfile.jvm}
    environment:
      JWT_ISSUER_URI: http://localhost:8090/ride
      JWT_JWK_SET_URI: http://mock-idp:8080/ride/jwks
    cpus: ${API_CPUS:-1.0}
    mem_limit: ${API_MEMORY:-512m}
    ports:
      - "127.0.0.1::8080"

  k6:
    environment:
      BASE_URL: ${BASE_URL:-http://api:8080}
    depends_on:
      - api
