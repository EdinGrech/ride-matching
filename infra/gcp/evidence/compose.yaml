services:
  prometheus-init:
    image: busybox:1.37
    volumes:
      - ${EVIDENCE_DIR}:/archive:ro
      - evidence-prometheus-data:/prometheus
    command: ["sh", "-c", "rm -rf /prometheus/* && cp -a /archive/prometheus/tsdb/. /prometheus/ && chmod -R a+rwX /prometheus"]

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    ports:
      - "127.0.0.1:${EVIDENCE_PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - evidence-prometheus-data:/prometheus
    depends_on:
      prometheus-init:
        condition: service_completed_successfully

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "127.0.0.1:${EVIDENCE_GRAFANA_PORT:-3101}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - evidence-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  evidence-prometheus-data:
  evidence-grafana-data:
